name: sdl3
buildsystem: cmake-ninja
builddir: true
cleanup:
  - /include
  - /lib/*.la
  - /lib/*.a
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_INSTALL_LIBDIR:PATH=lib
sources:
  - type: archive
    url: https://github.com/libsdl-org/SDL/releases/download/release-3.2.22/SDL3-3.2.22.tar.gz
    sha256: f29d00cbcee273c0a54f3f32f86bf5c595e8823a96b1d92a145aac40571ebfcc
    x-checker-data:
      type: anitya
      project-id: 375746
      stable-only: true
      versions:
        <: 4.0.0
      url-template: https://github.com/libsdl-org/SDL/releases/download/release-${version}/SDL3-${version}.tar.gz
