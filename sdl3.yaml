name: sdl3
buildsystem: cmake-ninja
builddir: true
cleanup:
  - /include
  - /lib/*.la
  - /lib/*.a
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_INSTALL_LIBDIR:PATH=lib
sources:
  - type: archive
    url: https://github.com/libsdl-org/SDL/releases/download/release-3.2.24/SDL3-3.2.24.tar.gz
    sha256: 81cc0fc17e5bf2c1754eeca9af9c47a76789ac5efdd165b3b91cbbe4b90bfb76
    x-checker-data:
      type: anitya
      project-id: 375746
      stable-only: true
      versions:
        <: 4.0.0
      url-template: https://github.com/libsdl-org/SDL/releases/download/release-${version}/SDL3-${version}.tar.gz
