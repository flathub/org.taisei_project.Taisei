name: sdl3
buildsystem: cmake-ninja
builddir: true
cleanup:
  - /include
  - /lib/*.la
  - /lib/*.a
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_INSTALL_LIBDIR:PATH=lib
sources:
  - type: archive
    url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.0/SDL3-3.4.0.tar.gz
    sha256: 082cbf5f429e0d80820f68dc2b507a94d4cc1b4e70817b119bbb8ec6a69584b8
    x-checker-data:
      type: anitya
      project-id: 375746
      stable-only: true
      versions:
        <: 4.0.0
      url-template: https://github.com/libsdl-org/SDL/releases/download/release-${version}/SDL3-${version}.tar.gz
