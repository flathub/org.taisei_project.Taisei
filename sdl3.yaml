name: sdl3
buildsystem: cmake-ninja
builddir: true
cleanup:
  - /include
  - /lib/*.la
  - /lib/*.a
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_INSTALL_LIBDIR:PATH=lib
sources:
  - type: archive
    url: https://github.com/libsdl-org/SDL/releases/download/release-3.2.20/SDL3-3.2.20.tar.gz
    sha256: 467600ae090dd28616fa37369faf4e3143198ff1da37729b552137e47f751a67
    x-checker-data:
      type: anitya
      project-id: 375746
      stable-only: true
      versions:
        <: 4.0.0
      url-template: https://github.com/libsdl-org/SDL/releases/download/release-${version}/SDL3-${version}.tar.gz
